services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ANALYST_MODE=${ANALYST_MODE:-real}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY must be set in .env}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-60}
      - LLM_CB_FAILURE_THRESHOLD=${LLM_CB_FAILURE_THRESHOLD:-3}
      - LLM_CB_RECOVERY_TIMEOUT_S=${LLM_CB_RECOVERY_TIMEOUT_S:-30}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-5}
      - LLM_BACKOFF_FACTOR=${LLM_BACKOFF_FACTOR:-2.0}
      - VERIFIER_MODEL=${VERIFIER_MODEL:-on}
      - PROMPT_VERSION=${PROMPT_VERSION:-analyst-1}
      - PIPELINE_DELAY_SECONDS=${PIPELINE_DELAY_SECONDS:-0}
      - REDIS_URL=redis://queue:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./index/store:/app/index/store
      - hf_cache:/root/.cache/huggingface
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-worker
    command: ["python", "-m", "app.worker"]
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ANALYST_MODE=${ANALYST_MODE:-real}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY must be set in .env}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-60}
      - LLM_CB_FAILURE_THRESHOLD=${LLM_CB_FAILURE_THRESHOLD:-3}
      - LLM_CB_RECOVERY_TIMEOUT_S=${LLM_CB_RECOVERY_TIMEOUT_S:-30}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-5}
      - LLM_BACKOFF_FACTOR=${LLM_BACKOFF_FACTOR:-2.0}
      - VERIFIER_MODEL=${VERIFIER_MODEL:-on}
      - PROMPT_VERSION=${PROMPT_VERSION:-analyst-1}
      - PIPELINE_DELAY_SECONDS=${PIPELINE_DELAY_SECONDS:-0}
      - REDIS_URL=redis://queue:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./index/store:/app/index/store
      - hf_cache:/root/.cache/huggingface
    depends_on:
      queue:
        condition: service_healthy

  queue:
    image: redis:7-alpine
    container_name: compliance-queue
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  model-stub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-model-stub
    command: ["python", "-m", "agent.model_stub_server"]
    profiles: ["stub"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: compliance-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    container_name: compliance-prometheus
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    container_name: compliance-grafana
    user: root
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  prometheus_data:
  grafana_data:
  hf_cache: