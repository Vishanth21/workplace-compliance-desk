[project]
name = "miniproject"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
