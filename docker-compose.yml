services:
  # 1. Web API & UI Client
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ANALYST_MODE=${ANALYST_MODE:-stub}
      - LLM_PROVIDER=${LLM_PROVIDER:-scripted}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://model-stub:8080/v1}
      - LLM_MODEL=${LLM_MODEL:-stub-compliance-model}
      - LLM_SCRIPTED_RESPONSES=${LLM_SCRIPTED_RESPONSES:-}
      - REDIS_URL=redis://queue:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      queue:
        condition: service_healthy
      model-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Asynchronous Background Task Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-worker
    command: ["python", "-m", "app.worker"]
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ANALYST_MODE=${ANALYST_MODE:-stub}
      - LLM_PROVIDER=${LLM_PROVIDER:-scripted}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://model-stub:8080/v1}
      - LLM_MODEL=${LLM_MODEL:-stub-compliance-model}
      - REDIS_URL=redis://queue:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      queue:
        condition: service_healthy
      model-stub:
        condition: service_healthy

  # 3. Message Queue & State Broker
  queue:
    image: redis:7-alpine
    container_name: compliance-queue
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. OpenAI-Compatible Mock Model Inference Stub
  model-stub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-model-stub
    command: ["python", "-m", "agent.model_stub_server"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Distributed Tracing Backend (D5)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: compliance-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # 6. Metrics Collection (D5, D6)
  prometheus:
    image: prom/prometheus:latest
    container_name: compliance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api

  # 7. Metrics Visualisation Dashboard (D5)
  grafana:
    image: grafana/grafana:latest
    container_name: compliance-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
